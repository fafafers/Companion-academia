<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<!-- fundo escuro antes de qualquer coisa: evita o clarão branco ao abrir -->
<style>html,body{background:#121519;color:#ECE8DF}</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#121519">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Zézinho Bodybuilder</title>
<meta name="description" content="Treino, progresso, dieta e água em um app só.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* @@CSS@@ */
</style>
</head>
<body>
<main>
  <section class="view on" id="v-treino" aria-label="Treino"></section>
  <section class="view" id="v-analytics" aria-label="Analytics"></section>
  <section class="view" id="v-dieta" aria-label="Dieta"></section>
  <section class="view" id="v-agua" aria-label="Água"></section>
  <section class="view" id="v-perfil" aria-label="Perfil"></section>
</main>
<nav class="nav" aria-label="Abas"><div class="nav-in">
  <button class="on" data-act="tab" data-t="treino"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M3.5 9v6M17.5 6.5v11M20.5 9v6M6.5 12h11"/></svg>Treino</button>
  <button data-act="tab" data-t="analytics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16M8 15l4-5 3 3 5-6"/></svg>Analytics</button>
  <button data-act="tab" data-t="dieta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="7"/><circle cx="12" cy="13" r="3"/><path d="M5 3v4M3.5 3v3a1.5 1.5 0 003 0V3M19 3v18"/></svg>Dieta</button>
  <button data-act="tab" data-t="agua"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3s6 6.4 6 11a6 6 0 01-12 0c0-4.6 6-11 6-11z"/></svg>Água</button>
  <button data-act="tab" data-t="perfil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Perfil</button>
</div></nav>

<div class="wo" id="wo" role="dialog" aria-label="Treino em andamento"></div>

<div class="rest" id="rest" role="timer" aria-live="polite">
  <svg viewBox="0 0 72 72"><circle class="ring-bg" cx="36" cy="36" r="30" fill="none" stroke-width="7"/>
    <circle class="ring" id="ring" cx="36" cy="36" r="30" fill="none" stroke-width="7" stroke-linecap="round" stroke-dasharray="188.5" transform="rotate(-90 36 36)"/></svg>
  <div><div class="rest-t" id="rest-t">0:00</div><div class="rest-l" id="rest-l">Descanso</div>
    <div class="rest-b"><button data-act="rest-minus">−15s</button><button data-act="rest-plus">+15s</button><button class="skip" data-act="rest-skip">Pular</button></div></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="party" id="party" role="dialog" aria-label="Treino concluído"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<div class="toast" id="toast" role="status"></div>

<script>
/* @@JS@@ */
</script>
<script>
/* Modo offline (service worker) e armazenamento persistente */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
</script>
</body>
</html>
